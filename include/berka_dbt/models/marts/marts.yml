version: 2

models:
  - name: dim_date
    description: "Conformed, generated calendar. One row per day, 1993-01-01 to 1998-12-31."
    columns:
      - name: date_key
        description: "Surrogate key in YYYYMMDD form, e.g. 19930101."
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]


  - name: dim_district
    description: "Conformed, SCD Type 0. One row per district."
    columns:
      - name: district_key
        tests: [unique, not_null]
      - name: district_id
        tests: [unique, not_null]     

  - name: dim_account
    description: "Conformed, SCD Type 1. One row per account."
    columns:
      - name: account_key
        tests: [unique, not_null]
      - name: account_id
        tests: [unique, not_null]
      - name: statement_frequency_name
        description: "Label from the seed. 'Unknown' would mean a code missing from the seed."
        tests:
          - accepted_values:
              arguments:
                values: ['Monthly', 'Weekly', 'After Transaction']

  - name: dim_transaction_profile
    description: "Junk dimension. One row per (type, operation, k_symbol) combination."
    columns:
      - name: transaction_profile_key
        tests: [unique, not_null]
      - name: direction
        description: "CREDIT = money in, DEBIT = money out."
        tests:
          - accepted_values:
              arguments:
                values: ['CREDIT', 'DEBIT']                